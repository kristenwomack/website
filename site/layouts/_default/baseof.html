<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>

    {{ $desc := .Description | default .Site.Params.description }}
    <meta name="description" content="{{ $desc }}" />
    <meta name="author" content="{{ .Site.Params.author }}" />

    {{ $ogImage := "/images/headshot.jpg" | absURL }}
    <meta property="og:site_name" content="{{ .Site.Title }}" />
    <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
    <meta property="og:description" content="{{ $desc }}" />
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:image" content="{{ $ogImage }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}" />
    <meta name="twitter:description" content="{{ $desc }}" />
    <meta name="twitter:image" content="{{ $ogImage }}" />

    <link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | relURL }}" />
    <link rel="apple-touch-icon" href="{{ "/images/headshot.jpg" | relURL }}" />
    {{ partial "theme-init.html" . }}
    <link rel="stylesheet" href="{{ "/css/styles.css" | relURL }}" />
    {{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="{{ .MediaType.Type }}" href="{{ .Permalink }}" title="{{ $.Site.Title }}" />{{ end }}
  </head>
  <body class="{{ block "body-class" . }}h-interior{{ end }}">
    {{ partial "theme-toggle.html" . }}
    {{ block "main" . }}{{ end }}
  </body>
</html>
